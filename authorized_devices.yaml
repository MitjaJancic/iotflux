    safety_limits: {max_pulse: "2.0s", auto_revert: "fc06_register_restore", max_power_watts: 24.0}
  - ip: "172.28.0.30"
    role: "docker_shelly_plug_sim"
    zone: "Docker Validation Bridge"
    safety_limits: {max_pulse: "2.0s", auto_revert: "relay_off", max_power_watts: 2500.0}
  - ip: "10.42.0.30"
    role: "corporate_vlan_test_node"
    zone: "Corporate IoT VLAN"
    safety_limits: {max_pulse: "2.0s", auto_revert: "relay_off", max_power_watts: 2500.0}
