services:

  # ===========================================================================
  # CORE SERVICES (Always Running on Pi 5 / Lab Bridge)
  # ===========================================================================
  central-broker:
    image: eclipse-mosquitto:2.0
    container_name: pi5-mqtt-broker
    hostname: central-broker
    profiles: ["core", "kitchen-utility", "all"]
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./profiles/auto_generated:/app/profiles/auto_generated
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -C 1 -i healthcheck -W 2 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.10
      tier2_kitchen_utility:
        ipv4_address: 172.30.2.10
      tier1_living_room:
        ipv4_address: 172.30.1.10
      tier2_safety_hallway:
        ipv4_address: 172.30.3.10
      tier3_perimeter_garage:
        ipv4_address: 172.30.4.10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  # ===========================================================================
  # TIER 1: LIVING ROOM (Low Security / Edge Devices)
  # ===========================================================================
  living-lights:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-living-lights
    hostname: living-lights
    profiles: ["living-room", "all"]
    environment:
      - DEVICE_ROLE=living_lights
      - PORT=80
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.20
      tier1_living_room:
        ipv4_address: 172.30.1.20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  living-streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-living-streamer
    hostname: living-streamer
    profiles: ["living-room", "all"]
    environment:
      - DEVICE_ROLE=media_streamer
      - PORT=8080
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.25
      tier1_living_room:
        ipv4_address: 172.30.1.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  shelly-plug-s:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-shelly-plug-s
    hostname: shelly-plug-s
    profiles: ["living-room", "all"]
    environment:
      - DEVICE_ROLE=shelly_plug_s
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/rpc/Shelly.GetDeviceInfo', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.30
      tier1_living_room:
        ipv4_address: 172.30.1.30
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ===========================================================================
  # TIER 2: KITCHEN & UTILITY (Operational Core)
  # ===========================================================================
  smart-fridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-smart-fridge
    hostname: smart-fridge
    profiles: ["kitchen-utility", "all"]
    environment:
      - DEVICE_ROLE=smart_fridge
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.35
      tier2_kitchen_utility:
        ipv4_address: 172.30.2.20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  shelly-2pm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-shelly-2pm
    hostname: shelly-2pm
    profiles: ["kitchen-utility", "all"]
    environment:
      - DEVICE_ROLE=shelly_2pm
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/rpc/Shelly.GetDeviceInfo', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.36
      tier2_kitchen_utility:
        ipv4_address: 172.30.2.30
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  coffee-maker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-coffee-maker
    hostname: coffee-maker
    profiles: ["kitchen-utility", "all"]
    environment:
      - DEVICE_ROLE=coffee_maker
      - PORT=8080
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.40
      tier2_kitchen_utility:
        ipv4_address: 172.30.2.40
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ===========================================================================
  # TIER 2: HALLWAY & BEDROOMS (Safety & Environmental Systems)
  # ===========================================================================
  smoke-alarm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-smoke-alarm
    hostname: smoke-alarm
    profiles: ["safety-hallway", "all"]
    environment:
      - DEVICE_ROLE=smoke_alarm
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.50
      tier2_safety_hallway:
        ipv4_address: 172.30.3.20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  air-purifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-air-purifier
    hostname: air-purifier
    profiles: ["safety-hallway", "all"]
    environment:
      - DEVICE_ROLE=air_purifier
      - PORT=8080
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/rpc/Purifier.GetStatus', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.55
      tier2_safety_hallway:
        ipv4_address: 172.30.3.30
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  # ===========================================================================
  # TIER 3: GARAGE & PERIMETER (High-Risk Access / Perimeter)
  # ===========================================================================
  smart-lock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-smart-lock
    hostname: smart-lock
    profiles: ["perimeter-garage", "all"]
    environment:
      - DEVICE_ROLE=smart_lock
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.60
      tier3_perimeter_garage:
        ipv4_address: 172.30.4.20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  video-doorbell:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-video-doorbell
    hostname: video-doorbell
    profiles: ["perimeter-garage", "all"]
    environment:
      - DEVICE_ROLE=video_doorbell
      - PORT=8080
      - RTSP_PORT=554
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 554), timeout=2); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.65
      tier3_perimeter_garage:
        ipv4_address: 172.30.4.30
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

  garage-controller:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi5-garage-controller
    hostname: garage-controller
    profiles: ["perimeter-garage", "all"]
    environment:
      - DEVICE_ROLE=garage_controller
      - PORT=80
      - MQTT_BROKER=172.28.0.10
      - MQTT_PORT=1883
    depends_on:
      - central-broker
    volumes:
      - ./profiles/auto_generated:/app/profiles/auto_generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/api/version', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      iotflux-lab:
        ipv4_address: 172.28.0.70
      tier3_perimeter_garage:
        ipv4_address: 172.30.4.40
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M

# =============================================================================
# ISOLATED DOCKER BRIDGES (Dynamic Discovery Bridge + Multi-Room Zone Subnets)
# =============================================================================
networks:
  iotflux-lab:
    name: iotflux-lab
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

  tier1_living_room:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.1.0/24

  tier2_kitchen_utility:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.2.0/24

  tier2_safety_hallway:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.3.0/24

  tier3_perimeter_garage:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.4.0/24
