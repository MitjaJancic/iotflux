device_id: generic_smarthome_hub
vendor: Generic
model: Zigbee / Z-Wave / Thread / Matter Smart-Home Hub
# Representative Zigbee/Z-Wave/Thread/Matter hub (Hue, SmartThings, Homey, Z2M,
# OpenThread border router). Detection reuses checks/mqtt_classifier.py,
# checks/net_auditor.py, checks/web_audit.py. coverage-matrix class 7.
protocols: [http, mqtt, coap]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/api/config"
        method: GET
        expect_auth: true
        description: "Hue/hub local API config (unauth field disclosure check)"
  mqtt:
    topic_prefix: "zigbee2mqtt"
    expected_tls: true
  coap:
    endpoints:
      - path: "/.well-known/core"
        method: GET
        expect_auth: true
        description: "Thread/CoAP resource discovery (read-only)"

flagged_ports:
  - port: 80
    reason: "Hub local HTTP API (cleartext API-key / bridge exposure class)"
    damage_score: {physical_safety: 1, privacy: 2, financial: 0, availability: 1, chaining_depth: 2}
  - port: 1883
    reason: "Anonymous MQTT / Zigbee2MQTT bridge -> actuator pivot"
    damage_score: {physical_safety: 2, privacy: 2, financial: 0, availability: 1, chaining_depth: 3}
  - port: 8080
    reason: "HomeKit Accessory Protocol (HAP) pairing surface"
    damage_score: {physical_safety: 1, privacy: 1, financial: 0, availability: 1, chaining_depth: 2}
  - port: 5540
    reason: "Matter commissioning (PASE/CASE) surface"
    damage_score: {physical_safety: 1, privacy: 1, financial: 0, availability: 1, chaining_depth: 2}

