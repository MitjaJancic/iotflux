device_id: generic_intrusion_alarm_panel
vendor: Generic
model: House / Intrusion Alarm Panel (security panel + communicator)
# Representative intrusion/burglar alarm panel. Detection reuses
# checks/net_auditor.py, checks/web_audit.py, checks/mqtt_classifier.py.
# coverage-matrix class 4. Assessment read-only; disarm paths never exercised.
protocols: [http, mqtt]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/settings"
        method: GET
        expect_auth: true
        description: "Panel settings / zone configuration (expects authentication)"
  mqtt:
    topic_prefix: "intrusion-panel"
    expected_tls: true

flagged_ports:
  - port: 80
    reason: "HTTP panel settings - sensitive-info exposure / default-credential class"
    damage_score: {physical_safety: 2, privacy: 2, financial: 1, availability: 2, chaining_depth: 3}
  - port: 1883
    reason: "MQTT zone telemetry / arm-disarm command channel (expects TLS)"
    damage_score: {physical_safety: 2, privacy: 2, financial: 1, availability: 2, chaining_depth: 3}

# CVEs below are copied verbatim from the Threat Intel coverage matrix
# (/workspace/iotsploit-research/coverage-matrix.md). No CVE IDs are invented;
# representative/highest-severity entries per class are included here.
