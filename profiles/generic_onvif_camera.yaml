device_id: generic_onvif_camera
vendor: Generic
model: ONVIF Profile S IP Camera / NVR
# Representative IP camera / NVR device class (ONVIF Profile S, RTSP, WS-Discovery).
# Detection logic: checks/camera_checks.py (unauth RTSP, HTTP snapshot, ONVIF
# disclosure) + checks/net_auditor.py fingerprinting. Covers coverage-matrix
# classes 2 and 6 (ONVIF profile depth).
protocols: [http]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/onvif/device_service"
        method: GET
        expect_auth: true
        description: "ONVIF Device service endpoint (expects authentication)"
      - path: "/snapshot.jpg"
        method: GET
        expect_auth: true
        description: "HTTP still-frame snapshot (expects authentication)"

flagged_ports:
  - port: 554
    reason: "RTSP video stream - check for unauthenticated DESCRIBE/live stream"
    damage_score: {physical_safety: 0, privacy: 3, financial: 0, availability: 1, chaining_depth: 1}
  - port: 80
    reason: "ONVIF / HTTP management + snapshot interface"
    damage_score: {physical_safety: 0, privacy: 2, financial: 0, availability: 1, chaining_depth: 1}
  - port: 8080
    reason: "Alternate ONVIF / HTTP management interface"
    damage_score: {physical_safety: 0, privacy: 2, financial: 0, availability: 1, chaining_depth: 1}
  - port: 3702
    reason: "WS-Discovery (ONVIF device enumeration over UDP)"
    damage_score: {physical_safety: 0, privacy: 1, financial: 0, availability: 0, chaining_depth: 1}

