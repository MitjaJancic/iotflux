# Second Zigbee2MQTT bridge (lab sim @ 172.28.0.26)
# Deliberate misconfig: unauthenticated /api/config leaks MQTT user/password
# and Zigbee network_key (same class of finding as 172.28.0.25).
# Maps to: zigbee_bridge_exposure + cross_protocol_credential_reuse
# (CWE-200 / CWE-522 / CAPEC-560).

device_id: zigbee2mqtt_secondary
vendor: Zigbee2MQTT (lab-sim)
model: CC2652P secondary coordinator
protocols: [http, mqtt]

authorized: true

network:
  http:
    base_url: "http://{ip}:8080"
    state_changing_endpoints:
      - path: "/api/config"
        method: GET
        expect_auth: true
        description: "Zigbee2MQTT config — must not leak MQTT credentials"

  mqtt:
    topic_prefix: "zigbee2mqtt"
    expected_tls: true
    credentials_to_test:
      - username: "admin"
        password: "admin"

flagged_ports:
  - port: 8080
    reason: "Zigbee2MQTT frontend; lab fixture serves /api/config without auth"
    damage_score:
      physical_safety: 1
      privacy: 2
      financial: 0
      availability: 1
      chaining_depth: 2

known_cves:
  - id: "LAB-ZIGBEE26-CONFIG-LEAK"
    description: >
      Unauthenticated GET /api/config returns mqtt.user/mqtt.password and
      Zigbee network_key (CWE-200 / CWE-522). Behavioral lab finding.
    cvss: 8.6
    damage_score:
      physical_safety: 2
      privacy: 2
      financial: 0
      availability: 1
      chaining_depth: 3
