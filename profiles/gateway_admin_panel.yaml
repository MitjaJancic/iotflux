# Secondary gateway admin panel (lab sim @ 172.28.0.41)
# Deliberate misconfigs: default LuCI creds (admin/admin, root/toor, …),
# UPnP WANIPConnection controlURL exposed (AddPortMapping surface present;
# Phase-1 probe is read-only GetExternalIPAddress only — CWE-284 / CAPEC-276).
# Maps to: upnp_enum, upnp_wan_exposure, http_auth / default-cred reuse,
# flagged_ports (5000, 5515). Taxonomy: CWE-306, CWE-522, CWE-798, CAPEC-180.

device_id: gateway_admin_panel
vendor: OpenWrt (lab-sim)
model: IoT Gateway Admin Panel (secondary)
protocols: [http]

authorized: true

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/cgi-bin/luci"
        method: POST
        expect_auth: true
        description: "LuCI login — lab fixture accepts well-known defaults"

flagged_ports:
  - port: 5000
    reason: "UPnP IGD WANIPConnection controlURL (AddPortMapping surface; probe is read-only)"
    damage_score:
      physical_safety: 0
      privacy: 1
      financial: 0
      availability: 2
      chaining_depth: 2
  - port: 5515
    reason: "Unauthenticated debug/backdoor TCP shell (lab misconfig)"
    damage_score:
      physical_safety: 0
      privacy: 2
      financial: 0
      availability: 2
      chaining_depth: 2

known_cves:
  - id: "LAB-GW41-DEFAULT-CREDS"
    description: >
      LuCI accepts default credential pairs (admin/admin, root/toor,
      root/root, admin/password, admin/1234) over cleartext HTTP
      (CWE-798 / CWE-522 / CWE-319). Behavioral lab finding.
    cvss: 9.1
    damage_score:
      physical_safety: 0
      privacy: 2
      financial: 0
      availability: 2
      chaining_depth: 2
  - id: "LAB-GW41-UPNP-WAN"
    description: >
      Unauthenticated UPnP WANIPConnection:1 controlURL answers
      GetExternalIPAddress; AddPortMapping action is advertised in the
      device description (CWE-284). Phase-1 probe never calls AddPortMapping.
    cvss: 7.5
    damage_score:
      physical_safety: 0
      privacy: 1
      financial: 0
      availability: 2
      chaining_depth: 2
