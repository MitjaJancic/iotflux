device_id: shelly_trv
vendor: Shelly
model: TRV
protocols: [http, mqtt]

authorized: true   # your own lab hardware - this is what lets http check skip --authorized

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/rpc/TRV.SetTarget?id=0&target_C=30"
        method: GET
        expect_auth: true
        description: "Set target temperature via RPC"

  mqtt:
    topic_prefix: "shellytrv"
    expected_tls: true

# Lab sim binding (testbed-expansion): Docker node 172.28.0.34 runs
# DEVICE_MODEL=shelly_trv with auth_en=False on Gen2 RPC (CWE-306).
# Physical units with auth enabled should keep expect_auth: true above.

flagged_ports:
  - port: 80
    reason: "Gen2 RPC HTTP plane; lab fixture ships with auth_en=false"
    damage_score:
      physical_safety: 2
      privacy: 0
      financial: 0
      availability: 1
      chaining_depth: 1

known_cves:
  - id: "LAB-TRV34-MISSING-AUTH"
    description: >
      Lab fixture Gen2 RPC (TRV.SetTarget / Shelly.GetStatus) accepts
      unauthenticated calls (auth_en=false). CWE-306 / CAPEC-180.
      Behavioral finding for the Docker sim at 172.28.0.34.
    cvss: 8.1
    damage_score:
      physical_safety: 2
      privacy: 0
      financial: 0
      availability: 1
      chaining_depth: 1
  - id: "CVE-2023-42144"
    description: "Wi-Fi password transmitted in cleartext during setup"
    cvss: 7.5
    damage_score:
      physical_safety: 2
      privacy: 1
      financial: 0
      availability: 0
      chaining_depth: 0
  - id: "CVE-2023-42143"
    description: "Shelly TRV missing integrity check on firmware update path -> manipulated firmware via redirect (CWE-354; from coverage-matrix)"
    cvss: null
    damage_score:
      physical_safety: 1
      privacy: 0
      financial: 0
      availability: 1
      chaining_depth: 2
