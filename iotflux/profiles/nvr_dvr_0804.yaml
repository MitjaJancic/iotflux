# NVR/DVR recorder (lab sim @ 172.28.0.52)
# Deliberate misconfigs: exposed telnet:23, weak HTTP Basic (admin/admin,
# admin/12345, root/root), outdated Boa/0.94.13 banner.
# Maps to: flagged_ports (telnet) + weak-auth / exposed-service findings
# + camera_checks on aggregated RTSP channels.
# Taxonomy: CWE-306, CWE-522, CWE-798, CAPEC-180.

device_id: nvr_dvr_0804
vendor: NVR-Lite (lab-sim)
model: DVR-0804HF-S
protocols: [http]

authorized: true

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/"
        method: GET
        expect_auth: true
        description: "NVR management portal — weak Basic auth in lab fixture"

flagged_ports:
  - port: 23
    reason: "Unauthenticated BusyBox telnetd management plane (lab misconfig)"
    damage_score:
      physical_safety: 0
      privacy: 2
      financial: 0
      availability: 2
      chaining_depth: 2
  - port: 554
    reason: "Aggregated RTSP channel plane"
    damage_score:
      physical_safety: 1
      privacy: 3
      financial: 0
      availability: 0
      chaining_depth: 1

known_cves:
  - id: "LAB-NVR52-TELNET-EXPOSED"
    description: >
      Lab fixture exposes unauthenticated telnetd on TCP/23 with a
      BusyBox shell banner (CWE-306). Behavioral finding.
    cvss: 9.8
    damage_score:
      physical_safety: 0
      privacy: 2
      financial: 0
      availability: 2
      chaining_depth: 2
  - id: "LAB-NVR52-WEAK-BASIC-AUTH"
    description: >
      HTTP Basic accepts well-known defaults (admin/admin, admin/12345,
      root/root) over cleartext HTTP (CWE-522 / CWE-319). Behavioral.
    cvss: 8.1
    damage_score:
      physical_safety: 1
      privacy: 2
      financial: 0
      availability: 1
      chaining_depth: 2
