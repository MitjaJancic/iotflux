[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotflux"
version = "0.4.0"
description = "IoTFlux - Authorized Residential IoT Security Conformance & Hardening Framework"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "cryptography>=42.0",
]

[project.scripts]
iotflux = "iotflux.core.cli:main"
iotsploit = "iotflux.core.cli:main"

[tool.setuptools.packages.find]
include = ["iotflux*"]
