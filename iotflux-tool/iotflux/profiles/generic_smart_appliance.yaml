device_id: generic_smart_appliance
vendor: Generic
model: Smart Appliance (oven / range / dryer / HVAC-adjacent, thermal-hazard class)
# Representative thermal smart appliance. Detection reuses checks/net_auditor.py,
# checks/web_audit.py, checks/mqtt_classifier.py, checks/firmware_*. coverage-matrix
# class 9. PROTOCOL/BEHAVIORAL focus; there are NO appliance-firmware CVEs in NVD
# for Home Connect / Samsung Family Hub / Whirlpool / Electrolux (kept CVE-free).
protocols: [http, mqtt]

authorized: false

# -----------------------------------------------------------------------------
# NON-NEGOTIABLE thermal hazard gate (iotsploit/core/appliance_safety.py).
# Phase-3 actuation of heating elements runs ONLY against a simulator or with
# hardware interlocks intact. Heating elements are NEVER energized on a
# production device. This gate is NOT subject to --override-unsafe.
# -----------------------------------------------------------------------------
appliance_safety:
  thermal_actuation_present: true
  heating_elements: [oven, cooktop, dryer_heater]
  simulator: false            # production by default -> thermal actuation REFUSED
  interlock_protected: false  # set true ONLY for a cold lab unit with heater interlock removed

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/remote_start"
        method: GET
        expect_auth: true
        description: "Remote-start flag (config READ only; EN 303 645 5.5-5 gap check)"
  mqtt:
    topic_prefix: "appliance"
    expected_tls: true

flagged_ports:
  - port: 80
    reason: "Appliance HTTP API - cleartext Basic auth / directory traversal class"
    damage_score: {physical_safety: 2, privacy: 2, financial: 1, availability: 2, chaining_depth: 2}
  - port: 1883
    reason: "Appliance MQTT telemetry / command channel (expects TLS)"
    damage_score: {physical_safety: 2, privacy: 2, financial: 1, availability: 2, chaining_depth: 2}

