device_id: shelly_lock
vendor: Shelly
model: Plus 1 (Smart Lock Strike Controller)
protocols: [http, mqtt]

authorized: true

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/rpc/Switch.Set?id=0&on=true&toggle_after=1"
        method: GET
        expect_auth: true
        description: "Auto-reverting 1s pulse on lock strike relay"
      - path: "/relay/0?turn=on&timer=1"
        method: GET
        expect_auth: true
        description: "Gen1 momentary 1-second relay pulse"

  mqtt:
    topic_prefix: "shellies/shellylock-mock"
    expected_tls: false

known_cves:
  - id: "SHELLY-LOCK-UNAUTH-ACTUATION"
    description: "Unauthenticated HTTP/RPC endpoint allows physical door unlock without credentials"
    cvss: 9.1
    damage_score:
      physical_safety: 3
      privacy: 1
      financial: 2
      availability: 2
      chaining_depth: 3
