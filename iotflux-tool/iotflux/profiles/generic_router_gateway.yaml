device_id: generic_router_gateway
vendor: Generic
model: Home Router / Residential Gateway (OpenWrt-class)
# Representative router/gateway device class. Detection reuses checks/web_audit.py,
# checks/net_auditor.py and the UPnP/SSDP surfaces. coverage-matrix class 5.
protocols: [http]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/cgi-bin/luci/"
        method: GET
        expect_auth: true
        description: "LuCI / web management UI (expects authentication)"

flagged_ports:
  - port: 80
    reason: "HTTP management UI - default-credential and cleartext transport class"
    damage_score: {physical_safety: 0, privacy: 2, financial: 1, availability: 2, chaining_depth: 2}
  - port: 443
    reason: "HTTPS management UI"
    damage_score: {physical_safety: 0, privacy: 1, financial: 1, availability: 1, chaining_depth: 1}
  - port: 23
    reason: "Telnet - cleartext remote management, default-credential class"
    damage_score: {physical_safety: 0, privacy: 2, financial: 1, availability: 2, chaining_depth: 3}
  - port: 22
    reason: "SSH remote management - default/weak credential class"
    damage_score: {physical_safety: 0, privacy: 2, financial: 1, availability: 2, chaining_depth: 3}
  - port: 1900
    reason: "UPnP / SSDP - device descriptor leak and WAN control exposure"
    damage_score: {physical_safety: 0, privacy: 1, financial: 1, availability: 1, chaining_depth: 2}
  - port: 7547
    reason: "TR-069 / CWMP remote management (ISP ACS) presence"
    damage_score: {physical_safety: 0, privacy: 1, financial: 1, availability: 2, chaining_depth: 2}

