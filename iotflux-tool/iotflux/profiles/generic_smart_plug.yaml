device_id: generic_smart_plug
vendor: Generic
model: Smart Plug / Smart Switch (Kasa/Tapo, Tuya, Sonoff classes)
# Representative smart plug/switch. Detection reuses checks/net_auditor.py,
# checks/mqtt_classifier.py, checks/web_audit.py. coverage-matrix class 10.
protocols: [http, mqtt]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/app"
        method: GET
        expect_auth: true
        description: "Local plug control API (expects authentication)"
  mqtt:
    topic_prefix: "plug"
    expected_tls: true

flagged_ports:
  - port: 80
    reason: "Local HTTP control API (cert-validation / impersonation class)"
    damage_score: {physical_safety: 1, privacy: 1, financial: 1, availability: 2, chaining_depth: 2}
  - port: 1883
    reason: "Cloud/local MQTT control channel (device impersonation class)"
    damage_score: {physical_safety: 1, privacy: 1, financial: 1, availability: 2, chaining_depth: 2}

# CVEs below are copied verbatim from the Threat Intel coverage matrix
