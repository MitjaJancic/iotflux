device_id: generic_fire_alarm_panel
vendor: Generic
model: Networked Fire / Fire-Detection Panel
# Representative fire alarm / fire-detection panel. Detection reuses
# checks/net_auditor.py, checks/web_audit.py, checks/mqtt_classifier.py.
# coverage-matrix class 3. Life-safety adjacent: assessment is read-only.
protocols: [http, mqtt]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/config"
        method: GET
        expect_auth: true
        description: "Panel configuration / zone export (expects authentication)"
  mqtt:
    topic_prefix: "fire-panel"
    expected_tls: true

flagged_ports:
  - port: 80
    reason: "HTTP panel management + config export - cleartext/default-credential class"
    damage_score: {physical_safety: 2, privacy: 2, financial: 0, availability: 3, chaining_depth: 2}
  - port: 5900
    reason: "VNC remote panel operation (hard-coded password class)"
    damage_score: {physical_safety: 3, privacy: 1, financial: 0, availability: 3, chaining_depth: 3}
  - port: 23
    reason: "Telnet maintenance console - cleartext, default-credential class"
    damage_score: {physical_safety: 1, privacy: 1, financial: 0, availability: 2, chaining_depth: 3}

