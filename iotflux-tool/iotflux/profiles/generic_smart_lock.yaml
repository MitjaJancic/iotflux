device_id: generic_smart_lock
vendor: Generic
model: Connected Smart Lock / Lock Bridge (BLE + Wi-Fi bridge)
# Representative smart lock + bridge (Nuki, August). Detection reuses
# checks/net_auditor.py, checks/web_audit.py, checks/capability_checks.py.
# coverage-matrix class 8. Physical-access device: actuation is lab-gated.
protocols: [http]

authorized: false

network:
  http:
    base_url: "http://{ip}"
    state_changing_endpoints:
      - path: "/lock/state"
        method: GET
        expect_auth: true
        description: "Lock bridge state/API (expects authentication)"

flagged_ports:
  - port: 80
    reason: "Lock bridge HTTP API (cert-validation / overflow class)"
    damage_score: {physical_safety: 3, privacy: 1, financial: 0, availability: 2, chaining_depth: 3}
  - port: 8080
    reason: "Alternate bridge management / WebSocket API"
    damage_score: {physical_safety: 3, privacy: 1, financial: 0, availability: 2, chaining_depth: 3}

